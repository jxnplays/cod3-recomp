name: CI

# There is no game data here and there never will be: default.xex is
# copyrighted and lives in CoD3RecompLib/private/, which is not committed.
# So this cannot build the title, and does not pretend to. What it can do is
# the part that is pure source - the tools, and the submodule patch that the
# recompiler depends on - which is where a contributor's change most often
# breaks something.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  patch:
    name: XenonRecomp patch applies
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Check the patch is well formed
        # A patch that has been re-saved with PowerShell redirection is UTF-16
        # and git rejects it with "No valid patches in input". That is silent
        # until someone tries to build, so fail here instead.
        shell: pwsh
        run: |
          $p = 'tools/patches/XenonRecomp.patch'
          if (-not (Test-Path $p)) { throw "$p is missing" }
          $bytes = [System.IO.File]::ReadAllBytes($p)
          if ($bytes.Length -lt 3) { throw "$p is empty" }
          # UTF-16LE/UTF-16BE both start with a byte-order mark.
          if ($bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE) { throw "$p is UTF-16LE; re-save it as UTF-8" }
          if ($bytes[0] -eq 0xFE -and $bytes[1] -eq 0xFF) { throw "$p is UTF-16BE; re-save it as UTF-8" }
          Write-Host "$p is $($bytes.Length) bytes, 8-bit clean"

      - name: Apply it to a pristine XenonRecomp
        shell: pwsh
        run: |
          git submodule update --init tools/XenonRecomp
          git -C tools/XenonRecomp apply --check ..\patches\XenonRecomp.patch
          git -C tools/XenonRecomp apply ..\patches\XenonRecomp.patch
          Write-Host "patch applied cleanly to the pinned submodule"

      - name: The patch does not touch anything it should not
        shell: pwsh
        run: |
          # The patch must change only the translator's sources. If it ever
          # grows a binary or a generated file, that is a bug in how it was
          # made, not something to ship.
          $changed = git -C tools/XenonRecomp diff --name-only
          $bad = $changed | Where-Object { $_ -notmatch '\.(cpp|h|hpp|md|txt)$' }
          if ($bad) { throw "patch touches non-source files: $($bad -join ', ')" }
          Write-Host "$($changed.Count) source files patched"

  tools:
    name: Tools build
    runs-on: windows-latest
    steps:
      # The submodule comes WITH the patch applied, which is what the local
      # build has. Without it this job sees an empty tools/XenonRecomp and
      # CMake cannot find a source directory - which is what the first run of
      # this job did.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply the patch
        shell: pwsh
        run: git -C tools/XenonRecomp apply ..\patches\XenonRecomp.patch

      # LLVM only. Visual Studio is NOT installed here: the runner image
      # already carries it, and `choco install visualstudio2022buildtools`
      # does not put vcvars64.bat where anything expects to find it - that
      # was the first version of this job and it failed on exactly that.
      - name: Pin LLVM
        shell: pwsh
        run: |
          choco install llvm --version=20.1.8 -y --no-progress
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang-cl.exe')) { throw "clang-cl not found after install" }
          clang-cl --version

      # Glob rather than name a path, the way recompile.ps1 does. That is what
      # lets the job survive a change of Visual Studio version or edition.
      - name: Locate Visual Studio, CMake and Ninja
        id: env
        shell: pwsh
        run: |
          $vcvars = @(Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Auxiliary\Build\vcvars64.bat' -ErrorAction SilentlyContinue) |
                     Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $vcvars) { throw 'vcvars64.bat not found; is Visual Studio on this runner?' }
          Write-Host "vcvars: $vcvars"
          "vcvars=$vcvars" >> $env:GITHUB_OUTPUT

          $cmake = @(Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe' -ErrorAction SilentlyContinue) |
                    Sort-Object FullName -Descending | Select-Object -First 1
          $ninja = @(Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe' -ErrorAction SilentlyContinue) |
                    Sort-Object FullName -Descending | Select-Object -First 1
          if ($cmake) { Write-Host "cmake: $($cmake.FullName)"; "cmake_dir=$($cmake.DirectoryName)" >> $env:GITHUB_OUTPUT }
          else { Write-Host 'cmake not inside Visual Studio; will use PATH' }
          if ($ninja) { Write-Host "ninja: $($ninja.FullName)"; "ninja_dir=$($ninja.DirectoryName)" >> $env:GITHUB_OUTPUT }
          else { Write-Host 'ninja not inside Visual Studio; will use PATH' }

      # XenonRecomp and XenonAnalyse only. CoD3Scan and PpcAsm are separate
      # CMake projects under tools/ and are not wired into this build; adding
      # them is the obvious next step for whoever wants the job to cover more.
      - name: Build XenonRecomp and XenonAnalyse
        shell: pwsh
        env:
          VCVARS: ${{ steps.env.outputs.vcvars }}
          CMAKE_DIR: ${{ steps.env.outputs.cmake_dir }}
          NINJA_DIR: ${{ steps.env.outputs.ninja_dir }}
        run: |
          $parts = @('C:\Program Files\LLVM\bin')
          if ($env:CMAKE_DIR) { $parts += $env:CMAKE_DIR }
          if ($env:NINJA_DIR) { $parts += $env:NINJA_DIR }
          $env:PATH = ($parts -join ';') + ';' + $env:PATH

          # vcvars64.bat sets the compiler environment inside its own cmd shell,
          # so the whole configure-and-build has to happen in one `cmd /c`.
          $inner = "cmake -S tools/XenonRecomp -B tools/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl && cmake --build tools/build --target XenonRecomp XenonAnalyse --parallel 4"
          & cmd /c "`"$($env:VCVARS)`" >nul 2>&1 && $inner"
          if ($LASTEXITCODE -ne 0) { throw "XenonRecomp failed to build (exit $LASTEXITCODE)" }
          if (-not (Test-Path 'tools/build/XenonRecomp/XenonRecomp.exe')) { throw "XenonRecomp.exe was not produced" }
          Write-Host "XenonRecomp and XenonAnalyse built"

      - name: Uploads
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tools
          path: tools/build/**/XenonRecomp.exe
          if-no-files-found: warn
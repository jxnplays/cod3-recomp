# XenonRecomp configuration for Call of Duty 3 (Xbox 360) â€” default.xex
#
# All paths are relative to the directory containing this file.
#
# Addresses below were auto-detected with tools/find_symbols.py, which scans the
# extracted PE image for the documented prologue/epilogue byte signatures.
# See docs/ANALYSIS.md for how each was confirmed.

# NOTE: XenonRecomp resolves these by literal string concatenation with the
# directory containing this TOML, so `file_path` MUST be relative (or the dump
# must sit directly under config/recomp/). tools/make_config.py regenerates this
# file with correct relative paths for an arbitrary dump location.
[main]
file_path = "../../../Call of Duty 3/default.xex"
out_directory_path = "../../build/ppc"
switch_table_file_path = "COD3_switch_tables.toml"

# Optimizations are intentionally all disabled. The XenonRecomp README advises
# getting a successfully running recompilation before enabling any of these,
# because they depend on the guest never violating the PowerPC ABI.

# --- PowerPC non-volatile register save/restore helpers ---
# XenonRecomp needs the start address of each of these because the compiler
# inlines them mid-function, so they must be recognised as fall-through blocks.
#
# Addresses below were located by tools/find_reg_helpers.py, which measures the
# actual spill/reload runs in the loaded image rather than assuming them. The
# previous values were wrong: none of them held a helper. 0x82350A60, declared
# as savegprlr_14, decodes as `addi r11,r0,4`.
#
# This title uses r12 as the link register throughout (mflr r12 occurs 10,518
# times across .text; mflr r0 occurs twice), and it has no lvx/stvx at all - the
# VMX helpers are spelled lfdup/stfdup, so the VMX entries are left unset.
#
# restfpr_14 / savefpr_14 account for 8,651 of the 9,270 branches XenonRecomp
# previously failed to resolve.
restgprlr_14_address  = 0x82350AB0   # unverified
savegprlr_14_address  = 0x82350A60   # unverified
restfpr_14_address    = 0x8234F260   # lfd  f14, -0x98(r1)
savefpr_14_address    = 0x8234F2B0   # stfd f14, -0x98(r1)

# --- Diagnostics -------------------------------------------------------------
#
# The page-heap free-list walk in sub_82357E48 recurses without terminating:
#
#   0x82357E68  lwzx   r11,r30,r31     ; r31 = 0x825C7110, r30 = descriptor
#   0x82357E6C  cmpli  r11,0
#   0x82357E70  bc     <skip>
#   0x82357E74  bl     sub_82357D08    ; recurse
#
# and sub_82357D08 allocates then calls straight back into sub_82357E48. The
# hook reports the descriptor and the list value at each visit, which is what
# establishes whether the walk never advances or the recursion is merely deep.
# Remove once the page heap is known to work.
[[midasm_hook]]
name = "HeapFreeListWalk"
address = 0x82357E74
registers = ["r30", "r31", "r11"]

# The allocation itself. sub_823510B0 calls this with the page heap descriptor
# and a size, and a null return is what drives the recursion above, so report
# the descriptor and the fields sub_823478F0 tests.
[[midasm_hook]]
name = "HeapAllocEntry"
address = 0x823478F0
registers = ["r3", "r4", "r5"]

# The gate on writing the free-list head. sub_82357D08 stores the block it just
# allocated only when this returns non-zero, so a zero here is why the list at
# 0x825C7160 is never seeded and the walk recurses forever.
[[midasm_hook]]
name = "HeapListSeedGate"
address = 0x8235B570
registers = ["r3", "r4"]

# sub_82357D08 is entered once per level of the recursion, so counting entries
# is the direct way to show whether the pair is re-entering itself or looping
# somewhere else.
[[midasm_hook]]
name = "HeapSeedNodeEntry"
address = 0x82357D44
registers = ["r29", "r30", "r28"]

# The very first instruction of sub_82357D08. The call stack names this
# function on every level of the recursion, but the hooks further down never
# fire, so this establishes whether it is entered at all and how often.
[[midasm_hook]]
name = "HeapNodeEntry"
address = 0x82357D08
registers = ["r3", "r31"]

# sub_82357D08 allocates one 28-byte node through sub_823510B0 and, if that
# returns null, takes an error path that ends at 0x82357DF4 returning 0. This
# hook sits on the test, so a null result is visible directly.
#
#   0x82357D68  bl   sub_823510B0
#   0x82357D6C  mr   r28,r3
#   0x82357D70  bne  <allocated>       ; non-zero -> carry on
#   ...                                ; zero -> error path
[[midasm_hook]]
name = "HeapNodeAllocResult"
address = 0x82357D70
registers = ["r3", "r28"]

# The recursive call site. The call stack shows sub_82357D08 returning to
# 0x82357D08 + 0x258, so the loop passes through here rather than through the
# function entry the earlier hook watched.
#
#   0x82357D90  bl   sub_82357E48   -> 0x82357D94
#   ... on return, 0x82357D98 tests the list head and either stops or goes on
[[midasm_hook]]
name = "HeapNodeRecurse"
address = 0x82357D90
registers = ["r29", "r30"]

# The functions that actually repeat. The call stack folds these into
# sub_82357D08 because they sit immediately after it, but they are separate
# entries in the mapping:
#
#   0x82357E18  lwz   r3,80(r30)     ; r30 = 0x825C7110 -> 0x825C7190
#   0x82357E2C  bl    0x8257836C     ; a kernel import thunk
#   0x82357E30  lwz   r1,0(r1)
#
# Every hook placed inside sub_82357D08 stays silent while these frames repeat,
# so the cycle runs through here rather than through that function's body.
[[midasm_hook]]
name = "HeapListPop"
address = 0x82357E28
registers = ["r30", "r31"]

# The faulting instruction itself. The crash is reported at sub_82357D08 +299,
# which is 0x82357E33 - inside sub_82357E18's body but attributed to D08 because
# the reporter folds contiguous functions together. Watching the store that
# faults, and the import call just before it, settles which is executing.
#
#   0x82357E2C  bl    RtlLeaveCriticalSection
#   0x82357E30  lwz   r1,0(r1)         ; <- faults, address 0x48
[[midasm_hook]]
name = "HeapListPopFault"
address = 0x82357E30
registers = ["r1", "r3"]

# The actual exit test for the recursion, and the instruction immediately after
# the recursive call returns:
#
#   0x82357D90  bl   sub_82357E48      ; recurse
#   0x82357D98  lwzx r11,r29,r30      ; has the list head been set?
#   0x82357DA4  bc   <give up>         ; non-zero -> stop recursing
#
# If r11 is still zero here the walk can never terminate, because the only
# thing that would set it is further down this same function.
[[midasm_hook]]
name = "HeapSeedExitTest"
address = 0x82357D98
registers = ["r11", "r29", "r30"]

# Control: this address is definitely executed - sub_823478F0 is entered three
# times during boot, and HeapAllocEntry (hooked at 0x823478F0) does report. If
# this one stays silent while that one fires, the silence is meaningful; if
# both are silent, the hooks are not wired the way the logs suggest.
[[midasm_hook]]
name = "HeapControlProbe"
address = 0x82357E74
registers = ["r30", "r31"]

# The store that actually seeds the free list:
#   loc_82357DD8:  stwx r28,r29,r30      ; [r29+r30] = r28
# If this is never reached the head stays zero and the walk cannot terminate.
[[midasm_hook]]
name = "HeapListSeedStore"
address = 0x82357DD8
registers = ["r28", "r29", "r30"]

















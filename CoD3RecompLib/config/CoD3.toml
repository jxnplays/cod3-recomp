# Call of Duty 3 (Xbox 360, USA/Europe) - XenonRecomp configuration
# Single-player executable: default.xex
#
# Addresses below were located with tools/CoD3Scan against this exact XEX.
# Image base 0x82000000, .text 0x820A0000..0x82578E8C, entry point 0x82344D00.

[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "CoD3_switch_tables.toml"

# No title update ships with this dump, so patch_file_path is intentionally absent.

# --- Optimizations -----------------------------------------------------
# All off for the first pass. The README is explicit: only enable these once
# the recompilation actually runs, otherwise a miscompile is impossible to
# attribute.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# --- Register save/restore helpers -------------------------------------
# Found by byte-pattern scan; each pattern matched exactly once.
restgprlr_14_address = 0x8234F2B0
savegprlr_14_address = 0x8234F260
restfpr_14_address   = 0x8234FA1C
savefpr_14_address   = 0x8234F9D0
restvmx_14_address   = 0x8234FD08
savevmx_14_address   = 0x8234FA70
restvmx_64_address   = 0x8234FD9C
savevmx_64_address   = 0x8234FB04

# --- setjmp / longjmp ---------------------------------------------------
# longjmp: 0x8234EEC0..0x8234EFD4 per .pdata, calls RtlUnwind at 0x8234EFC0,
#          restores f14-f31 / r13-r31 / CR / LR / SP from the jmp_buf in r7.
# setjmp:  begins at 0x82351CC0 with a hook check (a pointer at 0x82BEAAF0
#          is jumped to when set), then stores the same layout via r3 from
#          0x82351CD4 and returns 0 at 0x82351D88. The seven bl callers name
#          0x82351CC0; the address used to be the store at 0x82351CD4, which
#          nothing calls, so no setjmp was ever the host's and the first
#          longjmp of a level start went through an empty buffer.
# jmp_buf layout: 0x00 f14-f31, 0x90 SP, 0x98 r13-r31, 0x130 CR, 0x134 LR,
#                 0x138 unwind flag.
longjmp_address = 0x8234EEC0
setjmp_address  = 0x82351CC0

# --- Explicit function boundaries -------------------------------------
# XenonAnalyse's analyzer truncates a function at a jump-table `bctr`,
# because the table data that follows does not decode as code. Each entry
# below restores the real extent, derived by tools/CoD3Scan --fixfuncs from
# the recompiler's own out-of-range switch reports, then bounded by the
# end of each case body (its blr / unconditional branch). All starts were verified
# to follow padding or a terminator instruction.
#
# That bound is wrong when the case bodies end in a branch to a shared
# tail that lies after the last case: the tail is then cut off, the
# recompiler marks each branch to it "ERROR" and returns instead, and the
# function does nothing. The chapter title screen's text setter was one
# (0x824C0CD8): the level's four lines were set and never reached the
# panel. Four entries below are extended to the blr of their tails; grep
# the generated code for "// ERROR" after a recompile to find any more.
